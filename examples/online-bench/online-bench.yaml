# Use with a 20-step training run: four rounds, ten tasks per round.
online_bench:
  enabled: true
  every_n_steps: 5
  results_path: ./weaver/.logs
  save_artifacts: true
  suites:
  - name: swe_probe
    harbor_config: swe-probe.yaml
    timeout_seconds: 5400
  - name: terminal_probe
    harbor_config: terminal-probe.yaml
    timeout_seconds: 3600
