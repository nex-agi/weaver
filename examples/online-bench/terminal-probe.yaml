# Native Harbor configuration. Task revisions are examples, not server rules.
n_concurrent_trials: 3
n_attempts: 1
retry:
  max_retries: 0
environment:
  type: e2b
  delete: true
  suppress_override_warnings: true
  env: {}
  override_cpus: 8
agents:
- override_timeout_sec: 1800
  kwargs:
    version: 2.1.139
    max_turns: 100
    reasoning_effort: xhigh
    disallowed_tools: WebFetch,WebSearch,AskUserQuestion,EnterPlanMode,ExitPlanMode,EnterWorktree,ExitWorktree,CronCreate,CronDelete,CronList,Task,TaskOutput,TaskStop,NotebookEdit,ScheduleWakeup
    instruction_suffix: '


      <system-reminder>You are an autonomous coding agent running inside a sandboxed
      Linux environment. You are solving a self-contained task end-to-end with no
      human in the loop. After making changes, you must run or write appropriate tests
      to verify that your fix works correctly and does not introduce regressions.</system-reminder>'
    system_prompt_path: configs/harness/systemprompt_claude_code2.md
  import_path: nexau_agent.claude_code_direct:ClaudeCodeDirect
  env: {}
datasets: []
artifacts: []
verifier:
  override_timeout_sec: 600
