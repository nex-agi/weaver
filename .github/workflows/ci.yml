name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch to save disk space
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          # Install other dependencies
          pip install --no-cache-dir -e ".[dev]"
          pip install --no-cache-dir black isort pylint mypy
          pip install --no-cache-dir types-requests types-setuptools

      - name: Run Black
        run: black --check weaver/ tests/

      - name: Run isort
        run: isort --check-only weaver/ tests/

      - name: Run pylint
        run: pylint weaver/ --rcfile=pyproject.toml || true

      - name: Run mypy
        run: mypy weaver/ --config-file=pyproject.toml || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch to save disk space (2GB+ vs 200MB)
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          # Install other dependencies
          pip install --no-cache-dir -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          pip install --no-cache-dir pytest-cov
          pytest tests/ --cov=weaver --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  license-check:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check license headers
        run: |
          python tests/lint/check_license_header.py $(find weaver -name "*.py" -not -path "*/\__pycache__/*")
